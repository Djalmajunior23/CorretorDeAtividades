version: '3.8'

services:
  backend:
    build: .
    container_name: codecheck-backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AI_CODE_MODEL: qwen2.5-coder:3b
      AI_GENERAL_MODEL: llama3.2:3b
      AI_FEEDBACK_MODEL: llama3.2:3b
      AI_ACTIVITY_MODEL: qwen2.5-coder:3b
      AI_REPORT_MODEL: phi3:mini
      AI_REASONING_MODEL: deepseek-r1:8b
      STORAGE_PROVIDER: local
      PERSISTENT_VOLUME_PATH: /data
    expose:
      - "3000"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - codecheck_data:/data
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.codecheck.rule=Host(`api.teacherjuniors.com.br`)"
      - "traefik.http.routers.codecheck.entrypoints=websecure"
      - "traefik.http.routers.codecheck.tls=true"
      - "traefik.http.routers.codecheck.service=codecheck-service"
      - "traefik.http.services.codecheck-service.loadbalancer.server.port=3000"
      - "traefik.http.services.codecheck-service.loadbalancer.passhostheader=true"

volumes:
  codecheck_data:

networks:
  traefik-public:
    external: true
